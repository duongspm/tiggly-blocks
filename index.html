<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tiggly Blocks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bar" hidden>
  <span>Học khối:</span>
  <span id="cals"></span>
  <button id="reset">Xóa dữ liệu học</button>
  <label><input type="checkbox" id="keep" checked> Giữ hình khi nhấc khối</label>
  <label>Khoảng gom điểm <input type="range" id="rad" min="60" max="300" value="140"><span id="radv">140</span></label>
</div>
<div id="status"></div>
<div id="games"></div>
<div id="top"><button id="homeBtn" aria-label="Màn hình chính">🏠</button><div id="title"></div><button id="gear" aria-label="Dành cho phụ huynh (giữ 1 giây)">⚙️</button></div>
<div id="board"><div id="hud"></div><div id="hint">Đặt khối lên đây nhé!</div></div>
<script src="js/core/config.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/helpers.js"></script>
<script src="js/core/input.js"></script>
<script src="js/core/render.js"></script>
<script src="js/core/calibration.js"></script>
<script src="js/games/common.js"></script>
<script src="js/games/free.js"></script>
<script src="js/games/find.js"></script>
<script src="js/games/pictures.js"></script>
<script src="js/games/memory.js"></script>
<script src="js/games/safari.js"></script>
<script src="js/modes.js"></script>
<script src="js/ui/base.js"></script>
<script src="js/ui/home.js"></script>
<script src="js/ui/parent.js"></script>
</body>
</html>
